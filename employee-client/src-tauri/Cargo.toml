[package]
name = "employee-client"
version = "2.0.0"
edition = "2021"
description = "Flow Farm Field Worker Client - Market Research & Customer Visits"
authors = ["Flow Farm Team"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"

# 市场调研和外勤功能相关依赖
image = "0.24"                    # 图像处理（拍照、水印）
base64 = "0.21"                   # Base64编码
mime_guess = "2.0"                # MIME类型检测
geo = "0.26"                      # 地理位置计算
once_cell = "1.19"                # 全局状态管理
rand = "0.8"                      # 随机数生成（GPS模拟）
url = "2.5"                       # URL解析
