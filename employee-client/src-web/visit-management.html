<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Farm 员工客户端 - 客户拜访管理</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="visit-styles.css">
</head>
<body>
    <!-- 登录界面 -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <h1>Flow Farm 员工客户端</h1>
            <p class="subtitle">客户拜访管理系统</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">登录</button>
            </form>
            <div id="login-error" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="main-page" class="page">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-content">
                <h1>客户拜访管理</h1>
                <div class="user-info">
                    <span id="current-user">用户名</span>
                    <button id="logout-btn" class="btn-secondary">退出</button>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 导航标签 -->
            <nav class="tabs">
                <button class="tab-btn active" data-tab="visits">今日拜访</button>
                <button class="tab-btn" data-tab="gps">GPS定位</button>
                <button class="tab-btn" data-tab="media">多媒体</button>
            </nav>

            <!-- 拜访管理标签页 -->
            <div id="visits-tab" class="tab-content active">
                <div class="visits-header">
                    <h2>今日拜访计划</h2>
                    <div class="visits-stats">
                        <div class="stat-item">
                            <span class="stat-label">计划拜访</span>
                            <span id="planned-visits" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">已完成</span>
                            <span id="completed-visits" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">进行中</span>
                            <span id="active-visits" class="stat-value">0</span>
                        </div>
                    </div>
                </div>

                <!-- 拜访列表 -->
                <div id="visits-list" class="visits-list">
                    <!-- 动态加载拜访记录 -->
                </div>

                <!-- 当前活动拜访 -->
                <div id="active-visit" class="active-visit" style="display: none;">
                    <h3>当前拜访</h3>
                    <div class="visit-info">
                        <div class="visit-customer">
                            <strong id="active-customer-name">客户名称</strong>
                            <span id="active-customer-address">客户地址</span>
                        </div>
                        <div class="visit-time">
                            <span>开始时间: <span id="active-visit-start">--:--</span></span>
                        </div>
                        <div class="visit-actions">
                            <button id="end-visit-btn" class="btn-success">结束拜访</button>
                            <button id="cancel-visit-btn" class="btn-danger">取消拜访</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- GPS定位标签页 -->
            <div id="gps-tab" class="tab-content">
                <div class="gps-section">
                    <h2>GPS定位服务</h2>
                    
                    <!-- GPS状态 -->
                    <div class="gps-status">
                        <div class="status-item">
                            <span class="status-label">定位状态</span>
                            <span id="gps-status" class="status-value">未启动</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">权限状态</span>
                            <span id="gps-permission" class="status-value">未授权</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">精度</span>
                            <span id="gps-accuracy" class="status-value">--m</span>
                        </div>
                    </div>

                    <!-- 当前位置 -->
                    <div class="current-location">
                        <h3>当前位置</h3>
                        <div class="location-info">
                            <div class="location-item">
                                <span class="location-label">纬度</span>
                                <span id="current-latitude" class="location-value">--</span>
                            </div>
                            <div class="location-item">
                                <span class="location-label">经度</span>
                                <span id="current-longitude" class="location-value">--</span>
                            </div>
                            <div class="location-item">
                                <span class="location-label">更新时间</span>
                                <span id="location-timestamp" class="location-value">--</span>
                            </div>
                        </div>
                    </div>

                    <!-- GPS控制 -->
                    <div class="gps-controls">
                        <button id="request-permission-btn" class="btn-primary">申请权限</button>
                        <button id="start-tracking-btn" class="btn-success">开始定位</button>
                        <button id="stop-tracking-btn" class="btn-danger">停止定位</button>
                        <button id="get-location-btn" class="btn-secondary">获取位置</button>
                    </div>
                </div>
            </div>

            <!-- 多媒体标签页 -->
            <div id="media-tab" class="tab-content">
                <div class="media-section">
                    <h2>多媒体录制</h2>
                    
                    <!-- 录制状态 -->
                    <div class="recording-status">
                        <div class="status-indicator">
                            <span id="recording-status-text">就绪</span>
                            <div id="recording-indicator" class="indicator"></div>
                        </div>
                    </div>

                    <!-- 拍照功能 -->
                    <div class="media-group">
                        <h3>拍照</h3>
                        <div class="media-controls">
                            <button id="take-photo-btn" class="btn-primary">
                                📷 拍照
                            </button>
                        </div>
                    </div>

                    <!-- 录音功能 -->
                    <div class="media-group">
                        <h3>录音</h3>
                        <div class="media-controls">
                            <button id="start-audio-btn" class="btn-success">
                                🎤 开始录音
                            </button>
                            <button id="stop-audio-btn" class="btn-danger" disabled>
                                ⏹️ 停止录音
                            </button>
                        </div>
                    </div>

                    <!-- 录像功能 -->
                    <div class="media-group">
                        <h3>录像</h3>
                        <div class="media-controls">
                            <button id="start-video-btn" class="btn-success">
                                🎥 开始录像
                            </button>
                            <button id="stop-video-btn" class="btn-danger" disabled>
                                ⏹️ 停止录像
                            </button>
                        </div>
                    </div>

                    <!-- 媒体文件列表 -->
                    <div class="media-files">
                        <h3>媒体文件</h3>
                        <div id="media-files-list" class="files-list">
                            <!-- 动态加载媒体文件 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 拜访详情模态框 -->
    <div id="visit-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>拜访详情</h2>
            <div id="visit-details">
                <!-- 动态加载拜访详情 -->
            </div>
            <div class="modal-actions">
                <button id="start-visit-btn" class="btn-success">开始拜访</button>
                <button class="btn-secondary" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 成功/错误消息 -->
    <div id="message-container" class="message-container"></div>

    <script src="visit-app.js"></script>
</body>
</html>
